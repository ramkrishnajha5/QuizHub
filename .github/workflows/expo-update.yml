name: Publish Expo Update
on:
  push:
    branches:
      - main
      - feature/react-native-app
    paths:
      - 'mobile/**' # Only trigger when files in the mobile directory change

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./mobile
        run: npm install

      - name: Publish update
        working-directory: ./mobile
        run: eas update --branch production --message "Auto-update from GitHub: ${{ github.event.head_commit.message }}"
